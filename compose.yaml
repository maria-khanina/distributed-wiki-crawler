services:
  redis:
    image: redis:alpine
    container_name: fetching_queue
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: html_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  fetcher:
    build: .
    container_name: fetcher
    command: python -u fetcher.py
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
    env_file:
      - .env
  mongo:
    image: mongo
    container_name: pages_database
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    env_file:
      - .env
    volumes:
      - pages:/data/db
  parser:
    build: .
    container_name: parser
    command: python -u parser.py
    volumes:
      - .:/app
    depends_on:
      - mongo
      - redis
      - minio
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}


volumes:
  minio_data:
  pages:
