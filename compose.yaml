services:
  redis:
    image: redis:alpine
    container_name: fetching_queue
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: html_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
  seeder:
    build: .
    container_name: seeder
    command: python seed.py
    restart: "no"
    depends_on:
      redis:
        condition: service_started
    volumes:
    - .:/app
    environment:
      - REDIS_HOST=${REDIS_HOST}

  fetcher:
    build: .
    container_name: fetcher
    command: python -u fetcher.py
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
    env_file:
      - .env
  mongo:
    image: mongo
    container_name: pages_database
    ports:
      - "${MONGO_PORT}:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - pages:/data/db
  parser:
    build: .
    container_name: parser
    command: python -u parser.py
    volumes:
      - .:/app
    depends_on:
      - mongo
      - redis
      - minio
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/?authSource=admin


volumes:
  minio_data:
  pages:
