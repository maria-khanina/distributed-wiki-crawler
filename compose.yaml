services:
  redis:
    image: redis:alpine
    container_name: fetching_queue
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: html_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
  seeder:
    build: .
    command: python seed.py
    restart: "no"
    depends_on:
      - redis
    volumes:
    - .:/app
    environment:
      - REDIS_HOST=${REDIS_HOST}

  fetcher:
    build: .
    command: python -u fetcher.py
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
    env_file:
      - .env
    environment:
      - FETCHERS_PER_CONTAINER=50
      - AWS_ACCESS_KEY=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
  mongo:
    image: mongo
    container_name: pages_database
    command: mongod --wiredTigerCacheSizeGB 0.25
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - pages:/data/db
  crawler:
    build: .
    command: python -u parser.py
    environment:
      - PARSER_MODE=CRAWL
      - TASKS_PER_CONTAINER=40
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/?authSource=admin
      - AWS_ACCESS_KEY=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
    env_file:
      - .env
    depends_on:
      - redis
      - minio
    volumes:
      - .:/app
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.80'

  downloader:
    build: .
    command: python -u parser.py
    environment:
      - PARSER_MODE=DOWNLOAD
      - TASKS_PER_CONTAINER=5
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/?authSource=admin
      - AWS_ACCESS_KEY=${MINIO_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_PASSWORD}
    env_file:
      - .env
    depends_on:
      - mongo
      - minio
    volumes:
      - .:/app
      

volumes:
  minio_data:
  pages:
