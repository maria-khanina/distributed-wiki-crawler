services:
  redis:
    image: redis:alpine
    container_name: fetching_queue
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  fetcher:
    build: .
    container_name: fetcher
    command: python -u fetcher.py
    volumes:
      - .:/app
    depends_on:
      - redis
      - minio
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=html-storage
      - AWS_ACCESS_KEY=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - TASKS_PER_CONTAINER=2


volumes:
  minio_data:
